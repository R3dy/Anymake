<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anymake Eval Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#f4f5f7; --surface:#fcfcfd; --surface-2:#eef0f3; --sunken:#e9ebef;
  --ink:#0e1116; --ink-2:#4e535c; --muted:#868c96;
  --grid:#e2e4e9; --rule:#d8dbe1; --border:rgba(14,17,22,.10);
  --accent:#2a78d6; --accent-soft:#e7f0fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-wash:#e6f6e6; --crit-wash:#fbeaea; --warn-wash:#fdf3e0;
  --ord-1:#86b6ef; --ord-2:#6da7ec; --ord-3:#3987e5; --ord-4:#256abf; --ord-5:#184f95; --ord-6:#0d366b;
  --heat-0:#eef2f7; --heat-1:#cde2fb; --heat-2:#9ec5f4; --heat-3:#5598e7; --heat-4:#2a78d6; --heat-5:#1c5cab; --heat-6:#0d366b;
  --shadow:0 1px 2px rgba(14,17,22,.06), 0 8px 24px -16px rgba(14,17,22,.28);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0f12; --surface:#181b1f; --surface-2:#1f2328; --sunken:#131619;
    --ink:#f2f4f7; --ink-2:#b9bec7; --muted:#868c96;
    --grid:#282c32; --rule:#2f343b; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#14263d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-wash:#12240f; --crit-wash:#2b1414; --warn-wash:#2a2010;
    --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#256abf; --ord-4:#3987e5; --ord-5:#6da7ec; --ord-6:#9ec5f4;
    --heat-0:#1d2126; --heat-1:#173254; --heat-2:#184f95; --heat-3:#256abf; --heat-4:#3987e5; --heat-5:#6da7ec; --heat-6:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0f12; --surface:#181b1f; --surface-2:#1f2328; --sunken:#131619;
  --ink:#f2f4f7; --ink-2:#b9bec7; --muted:#868c96;
  --grid:#282c32; --rule:#2f343b; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#14263d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-wash:#12240f; --crit-wash:#2b1414; --warn-wash:#2a2010;
  --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#256abf; --ord-4:#3987e5; --ord-5:#6da7ec; --ord-6:#9ec5f4;
  --heat-0:#1d2126; --heat-1:#173254; --heat-2:#184f95; --heat-3:#256abf; --heat-4:#3987e5; --heat-5:#6da7ec; --heat-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em}
a{color:var(--accent)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0 56px}
header.masthead{border-bottom:1px solid var(--rule); background:var(--surface)}
.masthead .wrap{padding-block:18px 0}
.title-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px}
.title-row h1{font-size:20px}
.title-row .runid{font-family:var(--mono); font-size:13px; color:var(--muted)}
.synthetic{
  margin-left:auto; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); background:var(--warn-wash); border:1px solid var(--border);
  padding:3px 8px; border-radius:2px; font-weight:600;
}
.provenance{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--border);
  padding:3px 7px; border-radius:2px; white-space:nowrap;
}
.chip b{color:var(--ink); font-weight:500}
nav.views{display:flex; gap:2px; margin-top:14px; overflow-x:auto; scrollbar-width:thin}
nav.views button{
  border:0; background:none; padding:9px 12px 10px; cursor:pointer; white-space:nowrap;
  color:var(--ink-2); border-bottom:2px solid transparent; font-weight:500; font-size:13.5px;
}
nav.views button:hover{color:var(--ink)}
nav.views button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent)}
main{padding-top:24px}
.view[hidden]{display:none!important}

/* ---------- primitives ---------- */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow)}
.panel-head{display:flex; align-items:baseline; gap:10px; padding:14px 16px 0}
.panel-head h2{font-size:14.5px}
.panel-head .sub{font-size:12.5px; color:var(--muted)}
.panel-body{padding:14px 16px 16px}
.grid{display:grid; gap:14px}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.note{font-size:12.5px; color:var(--ink-2); line-height:1.55}
.stack{display:flex; flex-direction:column; gap:14px}

/* headline tiles: only for the numbers that ARE the point */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:14px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:14px 16px; box-shadow:var(--shadow)}
.tile .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tile .v{font-size:30px; font-weight:600; letter-spacing:-.02em; margin-top:6px; line-height:1.05}
.tile .v small{font-size:14px; font-weight:500; color:var(--ink-2); letter-spacing:0}
.tile .d{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.tile.alarm{border-left:3px solid var(--critical)}
.tile.alarm .v{color:var(--critical)}

/* tables */
table{width:100%; border-collapse:collapse}
th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:left; padding:0 10px 8px 0; white-space:nowrap}
td{padding:9px 10px 9px 0; border-top:1px solid var(--grid); vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

/* status */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:2px; white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%}
.pill.ok{background:var(--good-wash); color:var(--ink)} .pill.ok .dot{background:var(--good)}
.pill.bad{background:var(--crit-wash); color:var(--ink)} .pill.bad .dot{background:var(--critical)}
.pill.warn{background:var(--warn-wash); color:var(--ink)} .pill.warn .dot{background:var(--warn)}
.pill.na{background:var(--surface-2); color:var(--ink-2)} .pill.na .dot{background:var(--muted)}

/* bars */
.barrow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px}
.track{position:relative; height:9px; background:var(--sunken); border-radius:2px; overflow:hidden}
.fill{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:2px}
.fill.capped{background:var(--critical)}

/* pillar heat strip */
.heatstrip{display:flex; gap:2px}
.heatcell{
  width:34px; height:26px; border-radius:2px; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:500; cursor:default;
}

svg{display:block; max-width:100%}
.tooltip{
  position:fixed; z-index:50; pointer-events:none; opacity:0; transform:translate(-50%,-120%);
  background:var(--ink); color:var(--page); padding:6px 9px; border-radius:3px;
  font-size:12px; line-height:1.4; max-width:260px; box-shadow:var(--shadow); transition:opacity .08s;
}
.tooltip b{font-family:var(--mono); font-weight:600}

/* probe board */
.probeboard{display:grid; gap:2px; min-width:640px}
.pb-cell{padding:7px 8px; font-size:12px; background:var(--surface-2); border-radius:2px; display:flex; align-items:center; gap:6px}
.pb-head{background:none; color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; justify-content:center}
.pb-lab{background:none; padding-left:0}
.pb-lab .id{font-family:var(--mono); font-size:11.5px; color:var(--ink)}
.pb-lab .t{color:var(--ink-2); font-size:12px}
.pb-cell.pass{background:var(--good-wash)} .pb-cell.fail{background:var(--crit-wash)} .pb-cell.nt{background:var(--surface-2); color:var(--muted)}
.pb-cell .gl{font-family:var(--mono); font-weight:600; width:100%; text-align:center}
.pb-cell.fail .gl{color:var(--critical)} .pb-cell.pass .gl{color:var(--good)}

/* alarms */
.alarmlist{display:flex; flex-direction:column; gap:0}
.alarm-item{display:grid; grid-template-columns:auto 1fr; gap:12px; padding:11px 0; border-top:1px solid var(--grid)}
.alarm-item:first-child{border-top:0}
.alarm-item .sev{width:3px; border-radius:2px; background:var(--warn)}
.alarm-item.crit .sev{background:var(--critical)}
.alarm-item h3{font-size:13px}
.alarm-item p{margin:3px 0 0; font-size:12.5px; color:var(--ink-2)}
.alarm-item .who{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

/* drilldown */
.back{background:none; border:1px solid var(--border); border-radius:3px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--ink-2)}
.back:hover{color:var(--ink); background:var(--surface-2)}
.timeline-lane{display:grid; grid-template-columns:118px 1fr; align-items:center; gap:10px; padding:3px 0}
.timeline-lane .lab{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); text-align:right}
.derivation td{font-family:var(--mono); font-size:12px}
.derivation td.name{font-family:var(--sans)}
.contrib{color:var(--ink-2)}
.legend{display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block}

@media (max-width:760px){
  .wrap{padding-inline:16px}
  .title-row h1{font-size:18px}
  .synthetic{margin-left:0}
  .heatcell{width:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cfgName = i => RUN.configs[i].label;

/* tooltip (shared hover layer for every mark) */
const tip = $("#tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("pointerenter", e=>{
      tip.innerHTML = n.dataset.tip; tip.style.opacity = 1;
      const r = n.getBoundingClientRect();
      tip.style.left = Math.min(window.innerWidth-16, Math.max(140, r.left + r.width/2)) + "px";
      tip.style.top = r.top + "px";
    });
    n.addEventListener("pointerleave", ()=> tip.style.opacity = 0);
  });
}
const heat = v => v==null ? "var(--heat-0)"
  : v>=85 ? "var(--heat-6)" : v>=75 ? "var(--heat-5)" : v>=65 ? "var(--heat-4)"
  : v>=55 ? "var(--heat-3)" : v>=45 ? "var(--heat-2)" : "var(--heat-1)";
const heatInk = v => (v!=null && v>=65) ? "#fff" : "var(--ink)";

function frontierSVG(){
  const W=880,H=300,L=54,R=24,T=26,B=44;
  const x = u => L + (u/110)*(W-L-R);
  const y = s => T + (1 - s/100)*(H-T-B);
  let g = "";
  for(let s=0;s<=100;s+=25) g += `<line x1="${L}" y1="${y(s)}" x2="${W-R}" y2="${y(s)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L-8}" y="${y(s)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${s}</text>`;
  for(let u=0;u<=100;u+=25) g += `<text x="${x(u)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">$${u}</text>`;
  let marks = "";
  RUN.configs.forEach(c=>{
    const cx=x(c.usd), cy=y(c.composite);
    const tipTxt = `<b>${esc(c.label)}</b><br>composite ${c.composite} · $${c.usd.toFixed(2)}`;
    marks += c.control
      ? `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" data-tip="${tipTxt}"/>`
      : `<circle cx="${cx}" cy="${cy}" r="6" fill="${c.veto?"var(--critical)":"var(--s1)"}" stroke="var(--surface)" stroke-width="2" data-tip="${tipTxt}"/>`;
    const anchor = c.usd > 80 ? "end" : c.usd < 16 ? "start" : "middle";
    const lx = c.usd > 80 ? cx + 7 : c.usd < 16 ? cx - 7 : cx;
    marks += `<text x="${lx}" y="${cy-13}" text-anchor="${anchor}" font-size="11.5" fill="var(--ink-2)">${esc(c.label)}</text>`;
  });
  const fr = [RUN.configs[3],RUN.configs[1],RUN.configs[0]]
    .map(c=>`${x(c.usd)},${y(c.composite)}`).join(" ");
  return el("div",null,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Composite score against spend for each model config">
    ${g}
    <polyline points="${fr}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>
    ${marks}
    <text x="${L-8}" y="${T-10}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">composite</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">spend per run (USD) →</text>
  </svg>`);
}

  r.innerHTML = `<div class="panel-head"><h2>Rework tax</h2><span class="sub">share of spend on retries, re-plans and discarded work</span></div>`;
  const rb = el("div","panel-body stack");
  RUN.rework.forEach(x=>{
    const row = el("div","barrow");
    row.innerHTML = `<div>
        <div style="font-size:12.5px;margin-bottom:4px">${esc(cfgName(x.c))}</div>
        <div class="track" style="height:10px" data-tip="<b>${Math.round(x.v*100)}%</b> of spend produced no accepted work">
          <div class="fill" style="width:${x.v*100}%;background:${x.v>0.3?"var(--critical)":x.v>0.2?"var(--serious)":"var(--s1)"}"></div>
        </div></div>
      <div class="mono num" style="font-weight:600">${Math.round(x.v*100)}%</div>`;
    rb.appendChild(row);
  });
  rb.appendChild(el("p","note","Two configs can land on the same total with completely different stories behind it. This is the number that separates “worked steadily” from “thrashed and recovered.”"));
  r.appendChild(rb); g.appendChild(r);

  const ro = el("div","panel");
  ro.innerHTML = `<div class="panel-head"><h2>Spend by agent role</h2><span class="sub">tiered default</span></div>`;
  const rob = el("div","panel-body stack");
  RUN.roles.forEach(x=>{
    const row = el("div","barrow");
    row.innerHTML = `<div>
        <div style="font-size:12.5px;margin-bottom:4px">${esc(x.r)}</div>
        <div class="track" style="height:10px" data-tip="<b>${Math.round(x.pct*100)}%</b> of run spend"><div class="fill" style="width:${x.pct*100}%"></div></div>
      </div><div class="mono num" style="font-weight:600">${Math.round(x.pct*100)}%</div>`;
    rob.appendChild(row);
  });
  rob.appendChild(el("p","note","The Worker is the highest-volume role by design, which is the whole argument for putting it on the cheapest tier. This view is where that argument gets checked against reality."));
  ro.appendChild(rob); g.appendChild(ro);
  v.appendChild(g);
  bindTips(v);
}

/* ---------------- cell drill-down ---------------- */
function renderCell(){
  const v = $("#view-cell"); v.className="view stack";
  const c = RUN.cell;

  const head = el("div");
  head.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;align-items:center";
  const back = el("button","back","← All configs");
  back.addEventListener("click", ()=> show("overview"));
  head.appendChild(back);
  head.appendChild(el("div",null,`<span class="mono" style="font-size:13px">${esc(c.id)}</span>`));
  v.appendChild(head);

  const tiles = el("div","tiles");
  tiles.innerHTML = `
    <div class="tile"><div class="k">Composite</div><div class="v">${c.composite}</div>
      <div class="d">mechanical ${c.mech} · full ${c.full} — a 3-point spread means the score barely rests on judgment</div></div>
    <div class="tile"><div class="k">Stories</div><div class="v">${c.done}<small> / ${c.stories} done</small></div>
      <div class="d">${c.verified} independently verified — 2 short</div></div>
    <div class="tile"><div class="k">Spend</div><div class="v">$${c.usd.toFixed(2)}</div>
      <div class="d">wall-clock ${esc(c.wall)} · agent-active ${esc(c.agent)} at 4-cell concurrency</div></div>`;
  v.appendChild(tiles);

  const tp = el("div","panel");
  tp.innerHTML = `<div class="panel-head"><h2>Run timeline</h2>
    <span class="sub">reconstructed from the board-state snapshot series — 112 minutes</span></div>`;
  const tbdy = el("div","panel-body");
  c.timeline.forEach(l=>{
    const lane = el("div","timeline-lane");
    const bar = el("div"); bar.style.cssText="position:relative;height:16px;background:var(--sunken);border-radius:2px";
    l.segs.forEach(([a,b2,col,txt])=>{
      const s = el("div");
      s.style.cssText = `position:absolute;left:${a/112*100}%;width:${Math.max(1.2,(b2-a)/112*100)}%;top:0;bottom:0;background:${col};border-radius:2px`;
      s.dataset.tip = txt;
      bar.appendChild(s);
    });
    lane.innerHTML = `<div class="lab">${esc(l.lab)}</div>`;
    lane.appendChild(bar);
    tbdy.appendChild(lane);
  });
  tbdy.appendChild(el("p","note","Hover any block. Gate and escalation lanes sit on the same axis as the phases, so a slow phase and the rejection that caused it line up visually."));
  tp.appendChild(tbdy); v.appendChild(tp);

  const dp = el("div","panel");
  dp.innerHTML = `<div class="panel-head"><h2>Score derivation</h2>
    <span class="sub">raw → normalized → weighted → contribution, with weights after redistribution</span></div>`;
  const db = el("div","panel-body scroll-x");
  const t = el("table"); t.className="derivation"; t.style.minWidth="700px";
  t.innerHTML = `<thead><tr><th>ID</th><th>Metric</th><th>Raw</th><th>Normalizer</th>
    <th style="text-align:right">Score</th><th style="text-align:right">Weight</th><th style="text-align:right">Contribution</th></tr></thead>`;
  const tb = el("tbody");
  c.derivation.forEach(r=>{
    const tr = el("tr");
    tr.innerHTML = `<td>${esc(r[0])}</td><td class="name">${esc(r[1])}</td><td>${esc(r[2])}</td>
      <td class="contrib">${esc(r[3])}</td><td class="num" style="text-align:right;font-weight:600">${esc(r[4])}</td>
      <td class="num contrib" style="text-align:right">${esc(r[5])}</td>
      <td class="num" style="text-align:right">${esc(r[6])}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); db.appendChild(t);
  db.appendChild(el("p","note",`<span class="eyebrow">Dropped for this project type</span><br>
    <span class="mono">FID-08</span> design-system consistency, <span class="mono">CLI-UX</span>, install verification —
    not applicable to <span class="mono">saas</span>. Their weight was redistributed inside their pillars;
    nothing was scored zero for being irrelevant.`));
  dp.appendChild(db); v.appendChild(dp);

  const ap = el("div","panel");
  ap.innerHTML = `<div class="panel-head"><h2>Artifacts produced</h2><span class="sub">what the run left on disk</span></div>`;
  const ab = el("div","panel-body scroll-x");
  const t2 = el("table");
  t2.innerHTML = `<thead><tr><th style="width:44%">Path</th><th>Size</th><th>State</th></tr></thead>`;
  const tb2 = el("tbody");
  c.artifacts.forEach(([p2,s,st])=>{
    const tr = el("tr");
    const bad = st !== "complete";
    tr.innerHTML = `<td class="mono" style="font-size:12.5px">${esc(p2)}</td>
      <td class="note">${esc(s)}</td>
      <td><span class="pill ${bad?"warn":"ok"}"><span class="dot"></span>${esc(st)}</span></td>`;
    tb2.appendChild(tr);
  });
  t2.appendChild(tb2); ab.appendChild(t2); ap.appendChild(ab); v.appendChild(ap);
  bindTips(v);
}

renderOverview(); renderMatrix(); renderProbes(); renderTrust(); renderAutonomy(); renderSpend(); renderCell();
show("overview");
</script>
</body>
</html>
