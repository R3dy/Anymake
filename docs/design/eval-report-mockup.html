<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anymake Eval Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#f4f5f7; --surface:#fcfcfd; --surface-2:#eef0f3; --sunken:#e9ebef;
  --ink:#0e1116; --ink-2:#4e535c; --muted:#868c96;
  --grid:#e2e4e9; --rule:#d8dbe1; --border:rgba(14,17,22,.10);
  --accent:#2a78d6; --accent-soft:#e7f0fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-wash:#e6f6e6; --crit-wash:#fbeaea; --warn-wash:#fdf3e0;
  --ord-1:#86b6ef; --ord-2:#6da7ec; --ord-3:#3987e5; --ord-4:#256abf; --ord-5:#184f95; --ord-6:#0d366b;
  --heat-0:#eef2f7; --heat-1:#cde2fb; --heat-2:#9ec5f4; --heat-3:#5598e7; --heat-4:#2a78d6; --heat-5:#1c5cab; --heat-6:#0d366b;
  --shadow:0 1px 2px rgba(14,17,22,.06), 0 8px 24px -16px rgba(14,17,22,.28);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0f12; --surface:#181b1f; --surface-2:#1f2328; --sunken:#131619;
    --ink:#f2f4f7; --ink-2:#b9bec7; --muted:#868c96;
    --grid:#282c32; --rule:#2f343b; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#14263d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-wash:#12240f; --crit-wash:#2b1414; --warn-wash:#2a2010;
    --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#256abf; --ord-4:#3987e5; --ord-5:#6da7ec; --ord-6:#9ec5f4;
    --heat-0:#1d2126; --heat-1:#173254; --heat-2:#184f95; --heat-3:#256abf; --heat-4:#3987e5; --heat-5:#6da7ec; --heat-6:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0f12; --surface:#181b1f; --surface-2:#1f2328; --sunken:#131619;
  --ink:#f2f4f7; --ink-2:#b9bec7; --muted:#868c96;
  --grid:#282c32; --rule:#2f343b; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#14263d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-wash:#12240f; --crit-wash:#2b1414; --warn-wash:#2a2010;
  --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#256abf; --ord-4:#3987e5; --ord-5:#6da7ec; --ord-6:#9ec5f4;
  --heat-0:#1d2126; --heat-1:#173254; --heat-2:#184f95; --heat-3:#256abf; --heat-4:#3987e5; --heat-5:#6da7ec; --heat-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em}
a{color:var(--accent)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0 56px}
header.masthead{border-bottom:1px solid var(--rule); background:var(--surface)}
.masthead .wrap{padding-block:18px 0}
.title-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px}
.title-row h1{font-size:20px}
.title-row .runid{font-family:var(--mono); font-size:13px; color:var(--muted)}
.synthetic{
  margin-left:auto; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); background:var(--warn-wash); border:1px solid var(--border);
  padding:3px 8px; border-radius:2px; font-weight:600;
}
.provenance{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--border);
  padding:3px 7px; border-radius:2px; white-space:nowrap;
}
.chip b{color:var(--ink); font-weight:500}
nav.views{display:flex; gap:2px; margin-top:14px; overflow-x:auto; scrollbar-width:thin}
nav.views button{
  border:0; background:none; padding:9px 12px 10px; cursor:pointer; white-space:nowrap;
  color:var(--ink-2); border-bottom:2px solid transparent; font-weight:500; font-size:13.5px;
}
nav.views button:hover{color:var(--ink)}
nav.views button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent)}
main{padding-top:24px}
.view[hidden]{display:none!important}

/* ---------- primitives ---------- */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow)}
.panel-head{display:flex; align-items:baseline; gap:10px; padding:14px 16px 0}
.panel-head h2{font-size:14.5px}
.panel-head .sub{font-size:12.5px; color:var(--muted)}
.panel-body{padding:14px 16px 16px}
.grid{display:grid; gap:14px}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
.note{font-size:12.5px; color:var(--ink-2); line-height:1.55}
.stack{display:flex; flex-direction:column; gap:14px}

/* headline tiles: only for the numbers that ARE the point */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:14px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:14px 16px; box-shadow:var(--shadow)}
.tile .k{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tile .v{font-size:30px; font-weight:600; letter-spacing:-.02em; margin-top:6px; line-height:1.05}
.tile .v small{font-size:14px; font-weight:500; color:var(--ink-2); letter-spacing:0}
.tile .d{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.tile.alarm{border-left:3px solid var(--critical)}
.tile.alarm .v{color:var(--critical)}

/* tables */
table{width:100%; border-collapse:collapse}
th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:left; padding:0 10px 8px 0; white-space:nowrap}
td{padding:9px 10px 9px 0; border-top:1px solid var(--grid); vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

/* status */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:2px; white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%}
.pill.ok{background:var(--good-wash); color:var(--ink)} .pill.ok .dot{background:var(--good)}
.pill.bad{background:var(--crit-wash); color:var(--ink)} .pill.bad .dot{background:var(--critical)}
.pill.warn{background:var(--warn-wash); color:var(--ink)} .pill.warn .dot{background:var(--warn)}
.pill.na{background:var(--surface-2); color:var(--ink-2)} .pill.na .dot{background:var(--muted)}

/* bars */
.barrow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px}
.track{position:relative; height:9px; background:var(--sunken); border-radius:2px; overflow:hidden}
.fill{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:2px}
.fill.capped{background:var(--critical)}

/* pillar heat strip */
.heatstrip{display:flex; gap:2px}
.heatcell{
  width:34px; height:26px; border-radius:2px; display:grid; place-items:center;
  font-family:var(--mono); font-size:11px; font-weight:500; cursor:default;
}

svg{display:block; max-width:100%}
.tooltip{
  position:fixed; z-index:50; pointer-events:none; opacity:0; transform:translate(-50%,-120%);
  background:var(--ink); color:var(--page); padding:6px 9px; border-radius:3px;
  font-size:12px; line-height:1.4; max-width:260px; box-shadow:var(--shadow); transition:opacity .08s;
}
.tooltip b{font-family:var(--mono); font-weight:600}

/* probe board */
.probeboard{display:grid; gap:2px; min-width:640px}
.pb-cell{padding:7px 8px; font-size:12px; background:var(--surface-2); border-radius:2px; display:flex; align-items:center; gap:6px}
.pb-head{background:none; color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; justify-content:center}
.pb-lab{background:none; padding-left:0}
.pb-lab .id{font-family:var(--mono); font-size:11.5px; color:var(--ink)}
.pb-lab .t{color:var(--ink-2); font-size:12px}
.pb-cell.pass{background:var(--good-wash)} .pb-cell.fail{background:var(--crit-wash)} .pb-cell.nt{background:var(--surface-2); color:var(--muted)}
.pb-cell .gl{font-family:var(--mono); font-weight:600; width:100%; text-align:center}
.pb-cell.fail .gl{color:var(--critical)} .pb-cell.pass .gl{color:var(--good)}

/* alarms */
.alarmlist{display:flex; flex-direction:column; gap:0}
.alarm-item{display:grid; grid-template-columns:auto 1fr; gap:12px; padding:11px 0; border-top:1px solid var(--grid)}
.alarm-item:first-child{border-top:0}
.alarm-item .sev{width:3px; border-radius:2px; background:var(--warn)}
.alarm-item.crit .sev{background:var(--critical)}
.alarm-item h3{font-size:13px}
.alarm-item p{margin:3px 0 0; font-size:12.5px; color:var(--ink-2)}
.alarm-item .who{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

/* drilldown */
.back{background:none; border:1px solid var(--border); border-radius:3px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--ink-2)}
.back:hover{color:var(--ink); background:var(--surface-2)}
.timeline-lane{display:grid; grid-template-columns:118px 1fr; align-items:center; gap:10px; padding:3px 0}
.timeline-lane .lab{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); text-align:right}
.derivation td{font-family:var(--mono); font-size:12px}
.derivation td.name{font-family:var(--sans)}
.contrib{color:var(--ink-2)}
.legend{display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:10px; height:10px; border-radius:2px; display:inline-block}

/* verdict pills */
.vd{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:2px;white-space:nowrap}
.vd .dot{width:7px;height:7px;border-radius:50%}
.vd.keep{background:var(--good-wash)} .vd.keep .dot{background:var(--good)}
.vd.neutral{background:var(--surface-2);color:var(--ink-2)} .vd.neutral .dot{background:var(--muted)}
.vd.review{background:var(--warn-wash)} .vd.review .dot{background:var(--warn)}
.vd.negative{background:var(--crit-wash)} .vd.negative .dot{background:var(--critical)}
.vd.insurance{background:var(--accent-soft);color:var(--ink)} .vd.insurance .dot{background:var(--accent)}
.vd.unmeasured{background:var(--surface-2);color:var(--muted);border:1px dashed var(--rule)} .vd.unmeasured .dot{background:transparent}

/* trace explorer */
.run{border:1px solid var(--border);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.run summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.run summary::-webkit-details-marker{display:none}
.run summary:hover{background:var(--surface-2)}
.run[open] summary{border-bottom:1px solid var(--grid)}
.run .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.run .agent{font-family:var(--mono);font-size:12.5px;font-weight:600}
.run .meta{font-size:12px;color:var(--muted)}
.run .nums{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.run-body{padding:12px}
.turn{border-left:2px solid var(--grid);padding:0 0 12px 12px;margin-left:4px}
.turn:last-child{padding-bottom:0}
.turn .tn{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px}
.reason{background:var(--sunken);border-left:2px solid var(--ord-3);padding:8px 10px;border-radius:0 2px 2px 0;font-size:12.5px;color:var(--ink-2);font-style:italic}
.msg{font-size:12.5px;margin-top:6px}
.tools{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.tool{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:2px;padding:4px 8px}
.tool .tname{font-weight:600;color:var(--accent)}
.tool .targ{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .tres{color:var(--muted);white-space:nowrap}
.tool.sysfile .tname{color:var(--s2)}
.compbar{display:flex;gap:2px;height:14px;border-radius:2px;overflow:hidden;margin-top:8px}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fl .f{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-2)}
.fl .f.sys{background:var(--accent-soft);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid var(--border);background:var(--surface);border-radius:2px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

/* fix list */
.fix{border:1px solid var(--border);border-left:3px solid var(--critical);border-radius:3px;padding:12px 14px;background:var(--surface)}
.fix.med{border-left-color:var(--warn)} .fix.low{border-left-color:var(--muted)}
.fix h3{font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.fix .rank{font-family:var(--mono);color:var(--muted);font-weight:600}
.fix .freq{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:500}
.fix dl{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin:9px 0 0;font-size:12.5px}
.fix dt{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding-top:2px}
.fix dd{margin:0;color:var(--ink-2)}
.fix dd .mono{color:var(--ink)}
.stair{display:flex;flex-direction:column;gap:7px}
.stair-row{display:grid;grid-template-columns:170px 1fr 108px;gap:10px;align-items:center}
.stair-row .sl{font-size:12.5px}
.stair-row .sv{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .stair-row{grid-template-columns:1fr;gap:3px}
  .stair-row .sv{text-align:left}
  .fix dl{grid-template-columns:1fr}
  .wrap{padding-inline:16px}
  .title-row h1{font-size:18px}
  .synthetic{margin-left:0}
  .heatcell{width:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="title-row">
      <h1>Anymake Eval</h1>
      <span class="runid">run-041 &middot; 2026-09-12 03:14 UTC</span>
      <span class="synthetic">Synthetic data &middot; report mockup</span>
    </div>
    <div class="provenance" id="provenance"></div>
    <nav class="views" id="nav" aria-label="Report views"></nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-components" hidden></section>
  <section class="view" id="view-traces" hidden></section>
  <section class="view" id="view-instructions" hidden></section>
  <section class="view" id="view-fixes" hidden></section>
  <section class="view" id="view-matrix" hidden></section>
  <section class="view" id="view-probes" hidden></section>
  <section class="view" id="view-trust" hidden></section>
  <section class="view" id="view-autonomy" hidden></section>
  <section class="view" id="view-spend" hidden></section>
  <section class="view" id="view-cell" hidden></section>
</main>

<div class="tooltip" id="tip" role="status" aria-live="polite"></div>

<script>

    { id:"PRB-INTENT-01", t:"Intent conflict gated before code", r:["pass","pass","pass","nt"] },
    { id:"PRB-AMBIG-01",  t:"Ambiguous criterion escalates, not guessed", r:["pass","pass","fail","fail"] },

    { id:"PRB-EXP-02",    t:"Unscriptable criterion logged as LIMITATION", r:["pass","fail","fail","fail"] },
    { id:"PRB-DISP-01",   t:"Every spawn has a DISPATCH log line (INV-018)", r:["pass","pass","pass","fail"] },
    { id:"PRB-ROLE-01",   t:"Four distinct roles per story (INV-002)", r:["pass","pass","pass","fail"] },

  ],

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cfgName = i => RUN.configs[i].label;

/* tooltip (shared hover layer for every mark) */
const tip = $("#tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("pointerenter", e=>{
      tip.innerHTML = n.dataset.tip; tip.style.opacity = 1;
      const r = n.getBoundingClientRect();
      tip.style.left = Math.min(window.innerWidth-16, Math.max(140, r.left + r.width/2)) + "px";
      tip.style.top = r.top + "px";
    });
    n.addEventListener("pointerleave", ()=> tip.style.opacity = 0);
  });
}

function frontierSVG(){
  const W=880,H=300,L=54,R=24,T=26,B=44;
  const x = u => L + (u/110)*(W-L-R);
  const y = s => T + (1 - s/100)*(H-T-B);
  let g = "";
  for(let s=0;s<=100;s+=25) g += `<line x1="${L}" y1="${y(s)}" x2="${W-R}" y2="${y(s)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L-8}" y="${y(s)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${s}</text>`;
  for(let u=0;u<=100;u+=25) g += `<text x="${x(u)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">$${u}</text>`;
  let marks = "";
  RUN.configs.forEach(c=>{
    const cx=x(c.usd), cy=y(c.composite);
    const tipTxt = `<b>${esc(c.label)}</b><br>composite ${c.composite} · $${c.usd.toFixed(2)}`;
    marks += c.control
      ? `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" data-tip="${tipTxt}"/>`
      : `<circle cx="${cx}" cy="${cy}" r="6" fill="${c.veto?"var(--critical)":"var(--s1)"}" stroke="var(--surface)" stroke-width="2" data-tip="${tipTxt}"/>`;
    const anchor = c.usd > 80 ? "end" : c.usd < 16 ? "start" : "middle";
    const lx = c.usd > 80 ? cx + 7 : c.usd < 16 ? cx - 7 : cx;
    marks += `<text x="${lx}" y="${cy-13}" text-anchor="${anchor}" font-size="11.5" fill="var(--ink-2)">${esc(c.label)}</text>`;
  });
  const fr = [RUN.configs[3],RUN.configs[1],RUN.configs[0]]
    .map(c=>`${x(c.usd)},${y(c.composite)}`).join(" ");
  return el("div",null,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Composite score against spend for each model config">
    ${g}
    <polyline points="${fr}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>
    ${marks}
    <text x="${L-8}" y="${T-10}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">composite</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">spend per run (USD) →</text>
  </svg>`);
}

  tbdy.appendChild(el("p","note","Hover any block. Gate and escalation lanes sit on the same axis as the phases, so a slow phase and the rejection that caused it line up visually."));

  const dp = el("div","panel");
  dp.innerHTML = `<div class="panel-head"><h2>Score derivation</h2>
    <span class="sub">raw → normalized → weighted → contribution, with weights after redistribution</span></div>`;
  const db = el("div","panel-body scroll-x");
  const t = el("table"); t.className="derivation"; t.style.minWidth="700px";
  t.innerHTML = `<thead><tr><th>ID</th><th>Metric</th><th>Raw</th><th>Normalizer</th>
    <th style="text-align:right">Score</th><th style="text-align:right">Weight</th><th style="text-align:right">Contribution</th></tr></thead>`;
  const tb = el("tbody");
  c.derivation.forEach(r=>{
    const tr = el("tr");
    tr.innerHTML = `<td>${esc(r[0])}</td><td class="name">${esc(r[1])}</td><td>${esc(r[2])}</td>
      <td class="contrib">${esc(r[3])}</td><td class="num" style="text-align:right;font-weight:600">${esc(r[4])}</td>
      <td class="num contrib" style="text-align:right">${esc(r[5])}</td>
      <td class="num" style="text-align:right">${esc(r[6])}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); db.appendChild(t);
  db.appendChild(el("p","note",`<span class="eyebrow">Dropped for this project type</span><br>
    <span class="mono">FID-08</span> design-system consistency, <span class="mono">CLI-UX</span>, install verification —
    not applicable to <span class="mono">saas</span>. Their weight was redistributed inside their pillars;
    nothing was scored zero for being irrelevant.`));
  dp.appendChild(db); v.appendChild(dp);

  const ap = el("div","panel");
  ap.innerHTML = `<div class="panel-head"><h2>Artifacts produced</h2><span class="sub">what the run left on disk</span></div>`;
  const ab = el("div","panel-body scroll-x");
  const t2 = el("table");
  t2.innerHTML = `<thead><tr><th style="width:44%">Path</th><th>Size</th><th>State</th></tr></thead>`;
  const tb2 = el("tbody");
  c.artifacts.forEach(([p2,s,st])=>{
    const tr = el("tr");
    const bad = st !== "complete";
    tr.innerHTML = `<td class="mono" style="font-size:12.5px">${esc(p2)}</td>
      <td class="note">${esc(s)}</td>
      <td><span class="pill ${bad?"warn":"ok"}"><span class="dot"></span>${esc(st)}</span></td>`;
    tb2.appendChild(tr);
  });
  t2.appendChild(tb2); ab.appendChild(t2); ap.appendChild(ab); v.appendChild(ap);
  bindTips(v);
}

/* ---------------- components (the over-engineering view) ---------------- */
function renderComponents(){
  const v = $("#view-components"); v.className="view stack";

  const intro = el("div","panel");
  intro.innerHTML = `<div class="panel-head"><h2>Does each part earn its keep?</h2>
    <span class="sub">cost measured every run · benefit measured by removing the component and re-running</span></div>`;
  const ib = el("div","panel-body scroll-x");
  const t = el("table"); t.style.minWidth="760px";
  t.innerHTML = `<thead><tr>
    <th style="width:27%">Component</th><th style="text-align:right">Cost</th>
    <th style="width:15%">Share of run</th><th style="text-align:right">Δ when removed</th>
    <th style="text-align:right">Harm</th><th>Verdict</th></tr></thead>`;
  const tb = el("tbody");
  RUN.components.forEach(c=>{
    const tr = el("tr");
    const dtxt = c.delta==null ? "—" : (c.delta>0?"+":"") + c.delta;
    const dcol = c.delta==null ? "var(--muted)" : c.delta<=-4 ? "var(--good)" : c.delta>=3 ? "var(--critical)" : "var(--ink-2)";
    tr.innerHTML = `
      <td><div style="font-weight:600">${esc(c.n)}</div>
        <div class="mono" style="font-size:11px;color:var(--muted)">${esc(c.abl)}</div></td>
      <td class="mono num" style="text-align:right">$${c.usd.toFixed(2)}</td>
      <td><div class="track" style="height:8px" data-tip="<b>${Math.round(c.pct*100)}%</b> of run tokens">
            <div class="fill" style="width:${Math.min(100, c.pct/0.20*100)}%"></div></div></td>
      <td class="mono num" style="text-align:right;color:${dcol};font-weight:600">${dtxt}</td>
      <td class="mono num" style="text-align:right;color:${c.harm>3?"var(--critical)":"var(--ink-2)"}">${c.harm}</td>
      <td><span class="vd ${c.v}"><span class="dot"></span>${esc(c.v)}</span></td>`;
    tb.appendChild(tr);
    const nt = el("tr");
    nt.innerHTML = `<td colspan="6" style="border-top:0;padding-top:0"><div class="note" style="font-size:12px">${esc(c.note)}</div></td>`;
    tb.appendChild(nt);
  });
  t.appendChild(tb); ib.appendChild(t);
  ib.appendChild(el("p","note",`<span class="eyebrow">How to read Δ</span><br>
    Δ is the change in composite when the component is <b>removed</b>. Negative means removing it hurt — the
    component was doing work. Positive means the system scored <i>better</i> without it. <b>Harm</b> counts
    failures the component caused: false rejections, retry loops that escalated anyway, gates that blocked
    correct work. All Δ values here are n=2; a difference under about 4 points is inside noise.`));
  intro.appendChild(ib); v.appendChild(intro);

  /* staircase */
  const sp = el("div","panel");
  sp.innerHTML = `<div class="panel-head"><h2>Ablation staircase</h2>
    <span class="sub">bare model, then one layer at a time — s1-cli, n=2</span></div>`;
  const sb = el("div","panel-body");
  const st = el("div","stair");
  RUN.staircase.forEach(x=>{
    const row = el("div","stair-row");
    const d = x.d==null ? "" : `<span style="color:${x.d>0?"var(--good)":"var(--critical)"};font-weight:600">${x.d>0?"+":""}${x.d}</span> `;
    row.innerHTML = `<div class="sl">${esc(x.l)}</div>
      <div class="track" style="height:16px" data-tip="<b>${x.c}</b> composite · $${x.usd.toFixed(2)}">
        <div class="fill" style="width:${x.c}%;background:${x.d!=null&&x.d<0?"var(--critical)":"var(--s1)"}"></div></div>
      <div class="sv">${d}${x.c} · $${x.usd.toFixed(2)}</div>`;
    st.appendChild(row);
  });
  sb.appendChild(st);
  sb.appendChild(el("p","note",`<span class="eyebrow">The finding on this chart</span><br>
    Every layer up to the Experience Runner pays for itself. The <b>proxy gates</b> step costs $3.30 more
    and scores one point lower — inside noise, but it is the only step on the staircase that does not
    clearly earn its place, and it is the obvious first candidate for a leave-one-out run at higher n.`));
  sp.appendChild(sb); v.appendChild(sp);

  /* checking-stage yield */
  const yp = el("div","panel");
  yp.innerHTML = `<div class="panel-head"><h2>Checking-stage yield</h2>
    <span class="sub">unique catches are the only number that justifies a reviewer's existence</span></div>`;
  const yb = el("div","panel-body scroll-x");
  const t2 = el("table"); t2.style.minWidth="640px";
  t2.innerHTML = `<thead><tr><th>Stage</th><th style="text-align:right">Runs</th><th style="text-align:right">Cost</th>
    <th style="text-align:right">Catches</th><th style="text-align:right">Unique</th>
    <th style="text-align:right">False rej.</th><th style="text-align:right">Misses</th>
    <th style="text-align:right">$ / unique catch</th></tr></thead>`;
  const tb2 = el("tbody");
  RUN.stages.forEach(x=>{
    const per = x.uniq ? (x.usd/x.uniq) : null;
    const tr = el("tr");
    tr.innerHTML = `<td style="font-weight:600">${esc(x.s)}</td>
      <td class="mono num" style="text-align:right">${x.inv}</td>
      <td class="mono num" style="text-align:right">$${x.usd.toFixed(2)}</td>
      <td class="mono num" style="text-align:right">${x.catch}</td>
      <td class="mono num" style="text-align:right;font-weight:600;color:${x.uniq<=1?"var(--critical)":"var(--ink)"}">${x.uniq}</td>
      <td class="mono num" style="text-align:right;color:${x.fp>=5?"var(--critical)":"var(--ink-2)"}">${x.fp}</td>
      <td class="mono num" style="text-align:right;color:var(--ink-2)">${x.miss}</td>
      <td class="mono num" style="text-align:right">${per?"$"+per.toFixed(2):"—"}</td>`;
    tb2.appendChild(tr);
  });
  t2.appendChild(tb2); yb.appendChild(t2);
  yb.appendChild(el("p","note",`<span class="eyebrow">What this settles</span><br>
    The Experience Runner's entire argument is that it catches what a Validator and a green test suite cannot.
    Seven unique catches against one false rejection is that argument holding. The Product Owner Proxy's row is
    the opposite shape — one unique catch against six false rejections — which is what put it on the fix list
    rather than in the keep column.`));
  yp.appendChild(yb); v.appendChild(yp);

  /* ceremony */
  const cp = el("div","panel");
  cp.innerHTML = `<div class="panel-head"><h2>Ceremony ratio</h2><span class="sub">tokens spent on process vs. tokens spent on shipped code</span></div>`;
  const cb = el("div","panel-body");
  const c = RUN.ceremony;
  cb.appendChild(el("div",null,`
    <div style="display:flex;gap:2px;height:26px;border-radius:2px;overflow:hidden">
      <div style="flex:${c.process};background:var(--ord-3)" data-tip="<b>${Math.round(c.process*100)}%</b> — briefs, reports, board updates, gate verdicts"></div>
      <div style="flex:${c.code};background:var(--s3)" data-tip="<b>${Math.round(c.code*100)}%</b> — code and tests that shipped"></div>
    </div>
    <div class="legend" style="margin-top:9px">
      <span><span class="swatch" style="background:var(--ord-3)"></span>process artifacts — ${Math.round(c.process*100)}%</span>
      <span><span class="swatch" style="background:var(--s3)"></span>shipped code and tests — ${Math.round(c.code*100)}%</span>
    </div>`));
  cb.appendChild(el("p","note",`<span class="eyebrow">Read next to the control arm</span><br>
    63% of spend went to producing documents about the work rather than the work.
    <b>${Math.round(c.readback*100)}% of artifacts written were never read by any later agent</b> — pure cost.
    Time to first shipped line: <span class="mono">${esc(c.ttfc)}</span>. None of this is damning on its own;
    it is damning only if the no-Anymake control ships comparable quality, and on this run it does not (52 vs 78).`));
  cp.appendChild(cb); v.appendChild(cp);
  bindTips(v);
}

/* ---------------- traces ---------------- */
function renderTraces(){
  const v = $("#view-traces"); v.className="view stack";
  const p = el("div","panel");
  p.innerHTML = `<div class="panel-head"><h2>Agent traces</h2>
    <span class="sub mono">${esc(RUN.trace.cell)}</span></div>`;
  const b = el("div","panel-body");

  const filters = el("div","filters");
  [["all","Everything"],["fail","Failures and retries only"],["worker","Worker only"]].forEach(([k,lab],i)=>{
    const bt = el("button",null,lab);
    bt.setAttribute("aria-pressed", String(i===0));
    bt.addEventListener("click",()=>{
      filters.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      bt.setAttribute("aria-pressed","true");
      b.querySelectorAll(".run").forEach(r=>{
        const st=r.dataset.state, ag=r.dataset.agent;
        r.hidden = (k==="fail" && st==="ok") || (k==="worker" && !ag.includes("worker"));
      });
    });
    filters.appendChild(bt);
  });
  b.appendChild(filters);

  RUN.trace.runs.forEach((r,i)=>{
    const d = el("details","run");
    d.dataset.state = r.state; d.dataset.agent = r.agent;
    if(i===1) d.open = true;
    const badge = r.state==="fail" ? '<span class="pill bad"><span class="dot"></span>FAIL</span>'
      : r.state==="retry" ? '<span class="pill warn"><span class="dot"></span>retry 2</span>'
      : '<span class="pill ok"><span class="dot"></span>ok</span>';
    const sum = el("summary");
    sum.innerHTML = `<div class="who">
        <span class="agent">${esc(r.agent)}</span>
        <span class="meta">tier ${r.tier} · ${esc(r.model)} · story ${esc(r.story)} · attempt ${r.attempt}</span>
        ${badge}
        <span class="meta">→ <span class="mono">${esc(r.out)}</span></span>
      </div>
      <div class="nums">${(r.tin/1000).toFixed(1)}k in / ${(r.tout/1000).toFixed(1)}k out · ${esc(r.dur)}</div>`;
    d.appendChild(sum);

    const body = el("div","run-body");
    const total = r.comp.reduce((a,[,n])=>a+n,0);
    const ords = ["var(--ord-2)","var(--ord-3)","var(--ord-4)","var(--ord-5)","var(--ord-6)"];
    body.appendChild(el("div",null,`
      <div class="eyebrow">Input composition — ${(total/1000).toFixed(1)}k tokens</div>
      <div class="compbar">${r.comp.map(([n,x],j)=>`<div style="flex:${x};background:${ords[j%5]}"
        data-tip="<b>${esc(n)}</b><br>${x.toLocaleString()} tokens · ${Math.round(x/total*100)}%"></div>`).join("")}</div>
      <div class="legend" style="margin-top:7px">${r.comp.map(([n,x],j)=>
        `<span><span class="swatch" style="background:${ords[j%5]}"></span>${esc(n)} <span class="mono">${Math.round(x/total*100)}%</span></span>`).join("")}</div>`));

    r.turns.forEach((t,k)=>{
      const turn = el("div","turn");
      let h = `<div class="tn">turn ${k+1}</div>`;
      if(t.reason) h += `<div class="reason">${esc(t.reason)}</div>`;
      if(t.tools && t.tools.length) h += `<div class="tools">${t.tools.map(([n,a,res,ms])=>
        `<div class="tool${/AGENTS|TEMPLATES|PHASE_GUIDES|skills/.test(a)?" sysfile":""}">
           <span class="tname">${esc(n)}</span><span class="targ">${esc(a)}</span>
           <span class="tres">${esc(res)}${res?" · ":""}${ms}ms</span></div>`).join("")}</div>`;
      if(t.msg) h += `<div class="msg">${esc(t.msg)}</div>`;
      if(t.files && t.files.length) h += `<div class="fl">${t.files.map(([f,c])=>
        `<span class="f ${c==="sys"?"sys":""}">${esc(f)}</span>`).join("")}</div>`;
      if(t.flag) h += `<div class="pill warn" style="margin-top:8px;white-space:normal;align-items:flex-start">
        <span class="dot" style="margin-top:5px;flex:none"></span><span style="font-weight:500">${esc(t.flag)}</span></div>`;
      turn.innerHTML = h;
      body.appendChild(turn);
    });
    d.appendChild(body);
    b.appendChild(d);
  });

  b.appendChild(el("p","note",`<span class="eyebrow">Why the file chips matter</span><br>
    Highlighted chips are Anymake's own instruction files. Whether a rule's file was ever in an agent's
    context is what separates <i>“the instruction was ignored”</i> from <i>“the instruction never arrived”</i> —
    two failures that look identical in a transcript and need completely different fixes.
    Reasoning text is shown where the provider exposes it; where it doesn't, these blocks are omitted rather than guessed at.`));
  p.appendChild(b); v.appendChild(p);
  bindTips(v);
}

/* ---------------- instructions ---------------- */
function renderInstructions(){
  const v = $("#view-instructions"); v.className="view stack";
  const p = el("div","panel");
  p.innerHTML = `<div class="panel-head"><h2>Instruction files — attention and yield</h2>
    <span class="sub">across 21 cells: who read what, what it cost, and whether its rules did anything</span></div>`;
  const b = el("div","panel-body scroll-x");
  const t = el("table"); t.style.minWidth="760px";
  t.innerHTML = `<thead><tr><th style="width:32%">File</th><th style="text-align:right">Reads</th>
    <th style="text-align:right">Tokens / read</th><th style="width:14%">Share of input</th>
    <th style="text-align:right">Rules used</th><th style="text-align:right">Violated</th><th>Verdict</th></tr></thead>`;
  const tb = el("tbody");
  const maxPct = Math.max(...RUN.files.map(f=>f.pct));
  RUN.files.forEach(f=>{
    const vcls = f.v==="dead" ? "negative" : f.v==="expensive" ? "review" : f.v==="unread-but-violated" ? "negative" : "keep";
    const tr = el("tr");
    tr.innerHTML = `<td class="mono" style="font-size:12.5px">${esc(f.f)}</td>
      <td class="mono num" style="text-align:right;${f.r===0?"color:var(--critical);font-weight:600":""}">${f.r}</td>
      <td class="mono num" style="text-align:right">${f.tok?f.tok.toLocaleString():"—"}</td>
      <td><div class="track" style="height:8px" data-tip="<b>${Math.round(f.pct*100)}%</b> of all input tokens in the sweep">
        <div class="fill" style="width:${f.pct/maxPct*100}%;background:${f.pct>=.14?"var(--serious)":"var(--s1)"}"></div></div></td>
      <td class="mono num" style="text-align:right">${f.ex}</td>
      <td class="mono num" style="text-align:right;${f.vi?"color:var(--critical);font-weight:600":""}">${f.vi}</td>
      <td><span class="vd ${vcls}"><span class="dot"></span>${esc(f.v)}</span></td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); b.appendChild(t);
  b.appendChild(el("p","note",`<span class="eyebrow">Three findings on this table</span><br>
    <b>Dead —</b> <span class="mono">anymake-new-type</span> and <span class="mono">phase-5.md</span> were never opened
    in any cell. Either nothing in this suite reaches them, or discovery is broken; both are worth knowing.<br>
    <b>Expensive —</b> <span class="mono">AGENTS.md</span> is 17% of all input tokens across the sweep and exercised
    zero rules that its detailed counterparts didn't already carry.<br>
    <b>Unread but violated —</b> <span class="mono">anymake-design-system</span> has zero reads and two violations of
    rules it owns. That is a discovery bug, and rewriting the file would not have fixed it.`));
  p.appendChild(b); v.appendChild(p);
  bindTips(v);
}

/* ---------------- fix list ---------------- */
function renderFixes(){
  const v = $("#view-fixes"); v.className="view stack";
  const head = el("div","panel");
  head.innerHTML = `<div class="panel-head"><h2>Fix list</h2>
    <span class="sub">ranked by frequency × severity × confidence — the thing to open the morning after a sweep</span></div>
    <div class="panel-body"><p class="note" style="margin:0">Every entry names a cause class, because the class decides the
    edit: an <b>unread</b> instruction needs moving, not rewriting; a <b>violated</b> one needs shortening or a mechanical
    check; a <b>followed-but-wrong</b> one means the rule itself is the bug; and a <b>capability</b> finding means leave the
    prose alone and raise the tier. Each fix ships with the assertion that would catch its regression — the repo's own rule,
    applied to its own repairs.</p></div>`;
  v.appendChild(head);
  const list = el("div","stack");
  RUN.fixes.forEach(f=>{
    const card = el("div","fix"+(f.sev==="med"?" med":f.sev==="low"?" low":""));
    card.innerHTML = `
      <h3><span class="rank">#${f.rank}</span> ${esc(f.t)} <span class="freq">${esc(f.freq)}</span></h3>
      <dl>
        <dt>Cause</dt><dd>${esc(f.cause)}</dd>
        <dt>Target</dt><dd class="mono" style="font-size:12px">${esc(f.target)}</dd>
        <dt>Evidence</dt><dd>${esc(f.ev)}</dd>
        <dt>Proposed</dt><dd>${esc(f.fix)}</dd>
        <dt>Ships with</dt><dd>${esc(f.assert)}</dd>
      </dl>`;
    list.appendChild(card);
  });
  v.appendChild(list);
}

renderOverview(); renderComponents(); renderTraces(); renderInstructions(); renderFixes();
renderMatrix(); renderProbes(); renderTrust(); renderAutonomy(); renderSpend(); renderCell();
show("overview");
</script>
